<style type="text/css">
    .float-message {
        position: fixed;
        top: 5%;
        left: 50%;
        margin-left: -150px;
        width: 300px;
        z-index: 9999;
    }
</style>

<br/>
<form name="formulario"
      ng-submit="formulario.$valid && salvar(cliente)"
      ng-controller="ClienteController"
      novalidate>

    <div class="form-horizontal">
        <!-- Alerts -->
        <div class="float-message alert alert-danger" ng-show="mensagemErr">
            <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
            <strong>Erro!</strong> {{ mensagemErr }}
        </div>

        <div class="float-message alert alert-success" ng-show="mensagem">
            <button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
            <strong>Sucesso!</strong> {{ mensagem }}
        </div>

        <!-- Loading -->
        <div class="progress" ng-hide="carregado">
            <div class="progress-bar progress-bar-striped active"
                 role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"
                 style="width:100%">
                Carregando...
            </div>
        </div>

        <div ng-show="carregado">
            <legend>{{ cliente.name || '(novo cliente)' }}</legend>

            <!-- Revenda -->
            <div class="form-group"
                 ng-class="{'has-error': !formulario.revenda.$valid && (formulario.revenda.$dirty || formulario.$submitted)}">
                <label class="control-label col-md-2" for="inputRevenda">Revenda</label>
                <div class="col-md-10">
                    <select id="inputRevenda"
                            name="revenda"
                            class="form-control"
                            required
                            ng-model="cliente.resellerId"
                            ng-controller="RevendasListaController"
                            ng-options="revenda.id as revenda.name for revenda in revendas"
                            ng-disabled="!carregado || erro">
                        <option value="">Escolha uma Revenda</option>
                    </select>
                </div>
            </div>

            <!-- Nome -->
            <div class="form-group"
                 ng-class="{'has-error': !formulario.nome.$valid && (formulario.nome.$dirty || formulario.$submitted)}">
                <label class="control-label col-md-2" for="inputNome">Nome</label>
                <div class="col-md-10">
                    <input id="inputNome" name="nome" class="form-control" type="text"
                           ng-model="cliente.name" required>
                </div>
            </div>

            <!-- Razão Social -->
            <div class="form-group">
                <label class="control-label col-md-2" for="inputRazao">Razão Social</label>
                <div class="col-md-10">
                    <input id="inputRazao" name="razao" class="form-control" type="text"
                           ng-model="cliente.companyName">
                </div>
            </div>

            <!-- Tipo Doc -->
            <div class="form-group">
                <label class="control-label col-md-2">Tipo de Documento</label>
                <div class="col-md-10">
                    <label class="radio-inline">
                        <input type="radio" name="doc" value="CNPJ" ng-model="doc"> CNPJ
                    </label>
                    <label class="radio-inline">
                        <input type="radio" name="doc" value="CPF" ng-model="doc"> CPF
                    </label>
                </div>
            </div>

            <!-- Documento -->
            <div class="form-group"
                 ng-class="{'has-error': !formulario.cnpjcpf.$valid && (formulario.cnpjcpf.$dirty || formulario.$submitted)}">
                <label class="control-label col-md-2" for="inputDoc">Documento</label>
                <div class="col-md-10">
                    <input id="inputDoc" name="cnpjcpf" class="form-control" type="text"
                           ng-attr-ui-mask="{{ doc == 'CPF' ? '999.999.999-99' : '99.999.999/9999-99' }}"
                           ng-model="cliente.cpfCnpj" required>
                </div>
            </div>

            <!-- Telefone -->
            <div class="form-group">
                <label class="control-label col-md-2" for="inputTelefone">Telefone</label>
                <div class="col-md-10">
                    <input id="inputTelefone" name="telefone" class="form-control" type="text"
                           ng-model="cliente.phone">
                </div>
            </div>

            <legend>Endereço</legend>

            <div class="form-group">
                <label class="control-label col-md-2" for="inputLogradouro">Logradouro</label>
                <div class="col-md-10">
                    <input id="inputLogradouro" name="logradouro" class="form-control" type="text"
                           ng-model="cliente.street" placeholder="Rua, Av., Travessa...">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-2" for="inputNumero">Número</label>
                <div class="col-md-10">
                    <input id="inputNumero" name="numero" class="form-control" type="text"
                           ng-model="cliente.number">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-2" for="inputCompl">Complemento</label>
                <div class="col-md-10">
                    <input id="inputCompl" name="complemento" class="form-control" type="text"
                           ng-model="cliente.additionalInfo">
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-2" for="inputCidade">Cidade</label>
                <div class="col-md-10">
                    <input id="inputCidade" name="cidade" class="form-control" type="text"
                           ng-model="cliente.city">
                </div>
            </div>

            <!-- UF -->
            <div class="form-group"
                 ng-class="{'has-error': !formulario.uf.$valid && (formulario.uf.$dirty || formulario.$submitted)}">
                <label class="control-label col-md-2" for="inputUF">UF</label>
                <div class="col-md-10">
                    <select id="inputUF" name="uf" class="form-control" ng-model="cliente.state" required>
                        <option value="">Selecione</option>
                        <option value="AC">AC</option><option value="AL">AL</option><option value="AM">AM</option>
                        <option value="AP">AP</option><option value="BA">BA</option><option value="CE">CE</option>
                        <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                        <option value="MA">MA</option><option value="MG">MG</option><option value="MS">MS</option>
                        <option value="MT">MT</option><option value="PA">PA</option><option value="PB">PB</option>
                        <option value="PE">PE</option><option value="PI">PI</option><option value="PR">PR</option>
                        <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                        <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                        <option value="SE">SE</option><option value="SP">SP</option><option value="TO">TO</option>
                    </select>
                </div>
            </div>

            <!-- Tiny ID -->
            <div class="form-group">
                <label class="control-label col-md-2" for="inputTiny">ID Tiny</label>
                <div class="col-md-10">
                    <input id="inputTiny" name="tiny" class="form-control" type="text"
                           ng-model="cliente.tinyId">
                </div>
            </div>

            <!-- Actions -->
            <div class="form-group">
                <div class="col-md-offset-2 col-md-10">
                    <input type="submit" class="btn btn-primary" value="Salvar">
                    <a href="#/clientes" class="btn btn-default">Voltar à lista</a>
                </div>
            </div>
        </div>
    </div>
</form>
